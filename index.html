<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>System Magie</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, Segoe UI, Arial, sans-serif; background: #1a1815; color: #e8e4dc; }
    #canvas-wrap { position: fixed; inset: 0; z-index: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    #sidebar {
      position: fixed; top: 12px; right: 12px; bottom: 12px; width: min(380px, 48vw); z-index: 10;
      background: rgba(35, 32, 28, 0.92); border: 1px solid rgba(200, 190, 170, 0.25);
      border-radius: 14px; padding: 18px 20px; overflow: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.35);
      backdrop-filter: blur(8px);
    }
    #sidebar h1 { font-size: 18px; font-weight: 600; margin: 0 0 14px; }
    #sidebar .section-label { font-size: 13px; color: #9a9288; margin-top: 18px; margin-bottom: 8px; font-weight: 500; }
    button {
      width: 100%; padding: 12px 14px; margin-bottom: 8px; border-radius: 11px; border: 1px solid #6a5c4a;
      background: #3d352c; color: #f0ebe3; font-size: 15px; cursor: pointer;
    }
    button:hover { background: #4a4136; }
    #fig-list { list-style: none; padding: 0; margin: 12px 0 0; font-size: 14px; }
    #fig-list li.figure-row {
      padding: 10px 12px; margin-bottom: 8px; background: rgba(0,0,0,0.2); border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: row; align-items: center;
      gap: 10px; flex-wrap: nowrap;
      transition: border-color 0.12s ease, background 0.12s ease, box-shadow 0.12s ease;
    }
    #fig-list li.figure-row.is-selected {
      border-color: rgba(105, 145, 138, 0.42);
      background: rgba(90, 125, 118, 0.08);
      box-shadow: inset 0 0 0 1px rgba(95, 130, 122, 0.2);
    }
    #add-figure-wrap { position: relative; }
    #add-figure { display: flex; justify-content: space-between; align-items: center; }
    #add-figure::after { content: '▾'; transition: transform 0.15s; }
    #add-figure[aria-expanded="true"]::after { transform: rotate(180deg); }
    #add-figure-options { position: absolute; top: 100%; left: 0; right: 0; z-index: 35; padding: 6px; border: 1px solid #6a5c4a; border-radius: 11px; background: #242018; box-shadow: 0 10px 28px rgba(0,0,0,0.45); }
    #add-figure-options button { margin: 0; text-align: left; background: transparent; border-color: transparent; }
    #add-figure-options button:hover, #add-figure-options button:focus-visible { background: #4a4136; }

    #fig-list .figure-color-wrap { position: relative; flex-shrink: 0; }
    #fig-list .figure-color-trigger {
      width: 38px; height: 38px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.3);
      background: #302a22 center / contain no-repeat;
      padding: 0; cursor: pointer; display: block;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15);
    }
    #fig-list .figure-color-trigger:hover { border-color: rgba(255,255,255,0.55); }
    #fig-list .figure-color-trigger:focus { outline: 2px solid #c4a574; outline-offset: 2px; }
    #fig-list .figure-color-dropdown {
      display: none; position: absolute; left: 0; top: calc(100% + 6px); z-index: 30;
      flex-direction: column; gap: 6px; padding: 8px; border-radius: 10px;
      max-height: min(410px, 60vh); overflow-y: auto;
      background: #242018; border: 1px solid rgba(200,190,170,0.25);
      box-shadow: 0 10px 28px rgba(0,0,0,0.45);
    }
    #fig-list .figure-color-dropdown.is-open { display: flex; }
    #fig-list .figure-color-opt {
      width: 200px; height: 42px; border-radius: 8px; border: 2px solid transparent;
      background: #302a22 left center / 40px 40px no-repeat;
      padding: 0 10px 0 46px; color: #f0ebe3; text-align: left; font: inherit; font-size: 13px;
      cursor: pointer; flex-shrink: 0;
    }
    #fig-list .figure-color-opt[aria-selected="true"] { border-color: #c4a574; background-color: #494032; }
    #fig-list .figure-color-opt:hover { border-color: #c4a574; transform: scale(1.06); }
    #fig-list .figure-size-wrap { position: relative; flex-shrink: 0; }
    #fig-list .figure-size-trigger {
      width: 38px; height: 38px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.3);
      background: #302a22 center / contain no-repeat;
      padding: 0; cursor: pointer; display: block;
      background: rgba(0,0,0,0.22); color: #f0ebe3;
      font-size: 12px; font-weight: 700; line-height: 1;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15);
    }
    #fig-list .figure-size-trigger:hover { border-color: rgba(255,255,255,0.55); }
    #fig-list .figure-size-trigger:focus { outline: 2px solid #c4a574; outline-offset: 2px; }
    #fig-list .figure-size-dropdown {
      display: none; position: absolute; left: 0; top: calc(100% + 6px); z-index: 30;
      flex-direction: column; gap: 6px; padding: 8px; border-radius: 10px;
      background: #242018; border: 1px solid rgba(200,190,170,0.25);
      box-shadow: 0 10px 28px rgba(0,0,0,0.45);
    }
    #fig-list .figure-size-dropdown.is-open { display: flex; }
    #fig-list .figure-size-dropdown { width: 190px; padding: 12px; }
    #fig-list .figure-size-trigger { width: 48px; }
    #fig-list .figure-size-label, #fig-list .figure-size-limits { display: flex; justify-content: space-between; font-size: 12px; }
    #fig-list .figure-size-limits { color: #b9ae9e; }
    #fig-list .figure-size-slider { width: 100%; margin: 8px 0; accent-color: #c4a574; cursor: pointer; }
    #fig-list .figure-size-slider:focus-visible { outline: 2px solid #c4a574; outline-offset: 3px; }
    #fig-list .figure-name-input {
      flex: 1; min-width: 0; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.25); color: #f0ebe3; font-size: 15px; font-weight: 600;
    }
    #fig-list .figure-name-input:focus { outline: none; border-color: #8b7355; }
    #fig-list .btn-delete-icon {
      flex-shrink: 0; width: 36px; height: 36px; padding: 0; margin: 0; border-radius: 8px;
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid rgba(180,80,80,0.45); background: rgba(80,35,35,0.35); color: #e8b4b4;
      font-size: 18px; line-height: 1; cursor: pointer;
    }
    #fig-list .btn-delete-icon:hover { background: rgba(100,40,40,0.55); color: #fff; }
    #fig-list .btn-figure-view {
      flex-shrink: 0; width: 36px; height: 36px; padding: 0; margin: 0; border-radius: 8px;
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid rgba(140, 160, 190, 0.45); background: rgba(45, 55, 70, 0.45); color: #c8d8f0;
      cursor: pointer;
    }
    #fig-list .btn-figure-view:hover { background: rgba(55, 70, 90, 0.65); color: #fff; }
    #exit-figure-view {
      display: none; position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 50;
      width: max-content; max-width: calc(100vw - 28px); white-space: nowrap;
      margin: 0; padding: 10px 18px; border-radius: 11px; border: 1px solid rgba(200, 190, 170, 0.35);
      background: rgba(35, 32, 28, 0.94); color: #f0ebe3; font-size: 14px; font-weight: 600;
      cursor: pointer; box-shadow: 0 6px 24px rgba(0,0,0,0.35); backdrop-filter: blur(8px);
    }
    #exit-figure-view:hover { background: rgba(50, 46, 40, 0.96); }
    #boot-error {
      display: none; position: fixed; left: 12px; right: 12px; top: 12px; z-index: 100;
      max-height: 45vh; overflow: auto; padding: 12px 14px; border-radius: 10px;
      background: #3d1515; color: #ffccbc; font: 12px/1.45 ui-monospace, monospace;
      border: 1px solid #c62828; white-space: pre-wrap; word-break: break-word;
    }
    #sidebar-backdrop {
      display: none; position: fixed; inset: 0; z-index: 35;
      background: rgba(10, 9, 8, 0.42); border: none; padding: 0; margin: 0; cursor: pointer;
    }
    #sidebar-toggle {
      display: none; position: fixed; z-index: 25;
      top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right));
      width: auto; margin: 0; padding: 10px 14px; font-size: 14px; font-weight: 600;
    }
    #sidebar .sidebar-top {
      display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px;
    }
    #sidebar .sidebar-top h1 { margin: 0; flex: 1; min-width: 0; }
    #sidebar-close {
      display: none; flex-shrink: 0; width: 38px; height: 38px; padding: 0; margin: 0;
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.25); color: #f0ebe3; font-size: 22px; line-height: 1;
      cursor: pointer; align-items: center; justify-content: center;
    }
    #sidebar-close:hover { background: rgba(0,0,0,0.4); }
    @media (max-width: 768px) {
      #sidebar-toggle { display: block; }
      body.sidebar-open #sidebar-toggle { display: none; }
      body.sidebar-open #sidebar-backdrop { display: block; }
      #sidebar {
        top: 0; right: 0; bottom: 0; left: 0; width: auto; max-width: none;
        border-radius: 0; border-left: none; border-right: none; border-top: none; border-bottom: none;
        padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        transform: translateX(100%); transition: transform 0.24s ease;
        z-index: 45; -webkit-overflow-scrolling: touch;
      }
      body.sidebar-open { overflow: hidden; }
      body.sidebar-open #sidebar { transform: translateX(0); box-shadow: -12px 0 40px rgba(0,0,0,0.45); }
      #sidebar-close { display: inline-flex; }
      #fig-list li.figure-row { flex-wrap: wrap; row-gap: 8px; }
      #fig-list .figure-name-input { flex: 1 1 140px; min-width: 0; font-size: 16px; }
      #exit-figure-view { top: max(14px, env(safe-area-inset-top)); }
    }
    @media (min-width: 769px) {
      body.sidebar-open #sidebar-backdrop { display: none !important; }
      #sidebar { transform: none !important; }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.169.0/build/three.module.js",

<body>
  <div id="canvas-wrap"></div>
  <button type="button" id="sidebar-toggle" aria-controls="sidebar" aria-expanded="false">Figuren</button>
  <button type="button" id="sidebar-backdrop" aria-label="Seitenleiste schließen" tabindex="-1"></button>
  <button type="button" id="exit-figure-view" aria-label="Figurensicht beenden">Figurensicht beenden</button>
  <aside id="sidebar">
    <div class="sidebar-top">
      <h1>System Magie</h1>
      <button type="button" id="sidebar-close" aria-label="Seitenleiste schließen">×</button>
    </div>
    <div id="add-figure-wrap">
      <button type="button" id="add-figure" aria-expanded="false" aria-controls="add-figure-options">Figur hinzufügen</button>
      <div id="add-figure-options" role="group" aria-label="Figurentyp wählen" hidden>
        <button type="button" data-figure-type="human">Mensch</button>
        <button type="button" data-figure-type="light">Leuchtfigur</button>
      </div>
    </div>
    <div class="section-label">Figuren</div>
    <ul id="fig-list"></ul>
  </aside>
  <div id="boot-error" role="alert" aria-live="assertive"></div>

  <!-- Winter-Texturen als klassisches Script: funktioniert auch per file:// (ES-Import von ./winterroom-textures.mjs dort oft blockiert). -->
  <script src="winterroom-textures.js"></script>
  <script src="table-textures.js"></script>
  <script src="light-figure.js"></script>
  <script>
    (function () {
      const el = document.getElementById('boot-error');
      function show(msg, err) {
        if (!el) return;
        el.style.display = 'block';
        const detail = err && (err.stack || err.message || String(err));
        el.textContent = msg + (detail ? '\n\n' + detail : '');
        console.error(msg, err || '');
      }
      window.addEventListener('error', function (ev) { show(ev.message || 'Fehler', ev.error || ev); });
      window.addEventListener('unhandledrejection', function (ev) { show('Unhandled promise: ' + String(ev.reason), ev.reason); });
    })();
  </script>
  <script>
    (function () {
      const MQ = window.matchMedia('(max-width: 768px)');
      const toggle = document.getElementById('sidebar-toggle');
      const closeBtn = document.getElementById('sidebar-close');
      const backdrop = document.getElementById('sidebar-backdrop');

      function isMobile() { return MQ.matches; }

      function setSidebarOpen(open) {
        if (!isMobile()) {
          document.body.classList.remove('sidebar-open');
          if (toggle) toggle.setAttribute('aria-expanded', 'false');
          return;
        }
        document.body.classList.toggle('sidebar-open', open);
        if (toggle) toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      }

      toggle?.addEventListener('click', () => setSidebarOpen(true));
      closeBtn?.addEventListener('click', () => setSidebarOpen(false));
      backdrop?.addEventListener('click', () => setSidebarOpen(false));

      MQ.addEventListener('change', () => {
        if (!isMobile()) setSidebarOpen(false);
      });
    })();
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const { createLightFigure, tintLightFigure } = window.createLightFigureLibrary(THREE);

    const WINTER_ROOM_TEXTURES = window.WINTER_ROOM_TEXTURES;
    if (!WINTER_ROOM_TEXTURES || typeof WINTER_ROOM_TEXTURES !== 'object') {
      throw new Error('winterroom-textures.js fehlt oder wurde nicht geladen. Liegen winterroom-textures.js und diese HTML im gleichen Ordner?');
    }

    // --- Maße aus Original (Almhütte / Winterraum): Raum 4×4×2,4 m, Tischskalierung S ---
    const W_ROOM = 2.0;
    const H_ROOM_HALF = 1.2;
    const S = 0.36;
    const B_BOARD_LOCAL = 1.68;
    const TOP_LOCAL = 0.625;

    function localTableYToWorld(py) {
      return -H_ROOM_HALF + (py + 1.48) * S;
    }

    const BOARD_TOP_Y = localTableYToWorld(TOP_LOCAL);
    const BOARD_HALF = B_BOARD_LOCAL * S;

    // --- Menschenfigur V36: Lathe wie in System_Magie_Menschenfigur_Kontur_V36_anschauen.html ---
    const V36_CONTROL = [[0.3000,0.0000],[0.3070,0.0100],[0.3160,0.0300],[0.3230,0.0600],[0.3280,0.1000],[0.3370,0.1800],[0.3560,0.3000],[0.3780,0.4300],[0.3900,0.5600],[0.4000,0.6800],[0.4070,0.7900],[0.4100,0.8800],[0.4090,0.9700],[0.3980,1.0550],[0.3750,1.1400],[0.3480,1.2250],[0.3190,1.3100],[0.2900,1.3900],[0.2610,1.4650],[0.2310,1.5250],[0.2050,1.5750],[0.1840,1.6150],[0.1750,1.6550],[0.1814,1.6916],[0.2019,1.7282],[0.2345,1.7699],[0.2655,1.8222],[0.2938,1.8797],[0.3049,1.9371],[0.3050,1.9999],[0.2917,2.0625],[0.2670,2.1200],[0.2348,2.1723],[0.1920,2.2141],[0.1365,2.2433],[0.0693,2.2580],[0.0010,2.2601]];

    function buildCatmullRomProfile(control) {
      const profile = [];
      for (let i = 0; i < control.length - 1; i++) {
        const p0 = control[Math.max(0, i - 1)], p1 = control[i], p2 = control[i + 1], p3 = control[Math.min(control.length - 1, i + 2)];
        for (let k = 0; k < 8; k++) {
          const t = k / 8, t2 = t * t, t3 = t2 * t;
          const r = 0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3);
          const y = 0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3);
          profile.push([Math.max(0.001, r), y]);
        }
      }
      profile.push(control[control.length - 1]);
      return profile;
    }

    const V36_PROFILE = buildCatmullRomProfile(V36_CONTROL);
    const V36_Y_MIN = Math.min(...V36_PROFILE.map((p) => p[1]));
    const V36_Y_MAX = Math.max(...V36_PROFILE.map((p) => p[1]));

    function profileRadiusAtY(profile, yTarget) {
      for (let i = 0; i < profile.length - 1; i++) {
        const [r0, y0] = profile[i];
        const [r1, y1] = profile[i + 1];
        if (yTarget >= Math.min(y0, y1) - 1e-6 && yTarget <= Math.max(y0, y1) + 1e-6) {
          const dy = y1 - y0;
          const t = Math.abs(dy) < 1e-9 ? 0 : (yTarget - y0) / dy;
          return r0 + (r1 - r0) * THREE.MathUtils.clamp(t, 0, 1);
        }
      }
      return profile[profile.length - 1][0];
    }

    function buildHumanV36Geometry() {
      const control = V36_CONTROL;

      function meshFromVerts(vertices, indices) {
        const normals = new Array(vertices.length).fill(0);
        for (let i = 0; i < indices.length; i += 3) {
          let a = indices[i] * 3, b = indices[i + 1] * 3, c = indices[i + 2] * 3;
          const ab = [vertices[b] - vertices[a], vertices[b + 1] - vertices[a + 1], vertices[b + 2] - vertices[a + 2]];
          const ac = [vertices[c] - vertices[a], vertices[c + 1] - vertices[a + 1], vertices[c + 2] - vertices[a + 2]];
          const n = [ab[1] * ac[2] - ab[2] * ac[1], ab[2] * ac[0] - ab[0] * ac[2], ab[0] * ac[1] - ab[1] * ac[0]];
          for (const j of [a, b, c]) for (let k = 0; k < 3; k++) normals[j + k] += n[k];
        }
        for (let i = 0; i < normals.length; i += 3) {
          const l = Math.hypot(normals[i], normals[i + 1], normals[i + 2]) || 1;
          normals[i] /= l; normals[i + 1] /= l; normals[i + 2] /= l;
        }
        return { vertices, normals, indices };
      }

      const profile = buildCatmullRomProfile(control);

      const v = [];
      const uv = [];
      const ix = [];
      const seg = 96;
      for (let j = 0; j < profile.length; j++) {
        for (let i = 0; i <= seg; i++) {
          const a = 2 * Math.PI * i / seg;
          v.push(profile[j][0] * Math.cos(a), profile[j][1], profile[j][0] * Math.sin(a));
          uv.push(i / seg, profile[j][1] / V36_Y_MAX);
        }
      }
      for (let j = 0; j < profile.length - 1; j++) {
        for (let i = 0; i < seg; i++) {
          const a = j * (seg + 1) + i, b = a + seg + 1;
          ix.push(a, b, a + 1, a + 1, b, b + 1);
        }
      }
      const side = meshFromVerts(v, ix);

      const cv = [0, profile[0][1], 0];
      const ci = [];
      for (let i = 0; i <= seg; i++) {
        const a = 2 * Math.PI * i / seg;
        cv.push(profile[0][0] * Math.cos(a), profile[0][1], profile[0][0] * Math.sin(a));
      }
      for (let i = 0; i < seg; i++) ci.push(0, i + 1, i + 2);
      const cap = meshFromVerts(cv, ci);

      uv.push(0.5, 0.5);
      for (let i = 0; i <= seg; i++) {
        const a = 2 * Math.PI * i / seg;
        uv.push(0.5 + 0.5 * Math.cos(a), 0.5 + 0.5 * Math.sin(a));
      }
      const pos = [...side.vertices, ...cap.vertices];
      const norm = [...side.normals, ...cap.normals];
      const idx = [...side.indices, ...cap.indices.map((n) => n + side.vertices.length / 3)];

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(pos), 3));
      geo.setAttribute('normal', new THREE.Float32BufferAttribute(new Float32Array(norm), 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
      geo.setIndex(idx);
      return geo;
    }

    // Faktor 1 entspricht der bisherigen Größe M.
    const FIGURE_SCALE_M = 0.11;
    const FIGURE_SIZE_MIN = 0.5;
    const FIGURE_SIZE_MAX = 2;

    function figureScaleForSize(size = 1) {
      return FIGURE_SCALE_M * THREE.MathUtils.clamp(size, FIGURE_SIZE_MIN, FIGURE_SIZE_MAX);
    }

    function formatFigureSize(size) {
      return size.toLocaleString('de-DE', { maximumFractionDigits: 2 }) + '×';
    }

    function applyFigureSize(p) {
      const mesh = p.group.userData.mesh;
      const s = figureScaleForSize(p.size ?? 1);
      mesh.scale.setScalar(s);
      mesh.position.y = -mesh.geometry.boundingBox.min.y * s;
      if (p.id === selectedFigureId) syncSelectionRingVisual();
    }

    function selectionRingScaleForPlacement(p) {
      return p?.size ?? 1;
    }

    // --- Szene ---
    const wrap = document.getElementById('canvas-wrap');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.05, 100);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    wrap.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.2, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 0.35;
    controls.maxDistance = Infinity;

    // Start etwas im Raum (näher am target), weniger dominante Außenwand
    camera.position.set(0.88, 0.67, 1.91);
    controls.update();

    const startCameraPos = new THREE.Vector3();
    const startCameraQuat = new THREE.Quaternion();
    const startControlsTarget = new THREE.Vector3();
    function captureStartCamera() {
      startCameraPos.copy(camera.position);
      startCameraQuat.copy(camera.quaternion);
      startControlsTarget.copy(controls.target);
    }
    captureStartCamera();

    const cozyLightRig = (() => {
      const ambient = new THREE.AmbientLight(0xffffff, 0);
      const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0);
      const key = new THREE.DirectionalLight(0xffffff, 0);
      const fill = new THREE.DirectionalLight(0xffffff, 0);
      const rim = new THREE.DirectionalLight(0xffffff, 0);
      function setupShadow(light) {
        light.castShadow = true;
        light.shadow.mapSize.set(2048, 2048);
        light.shadow.bias = -0.0002;
        light.shadow.camera.near = 0.1;
        light.shadow.camera.far = 12;
        light.shadow.camera.left = light.shadow.camera.bottom = -4;
        light.shadow.camera.right = light.shadow.camera.top = 4;
      }
      setupShadow(key);
      fill.castShadow = false;
      rim.castShadow = false;
      scene.add(ambient, hemi, key, fill, rim);
      return { ambient, hemi, key, fill, rim };
    })();

    /** Beleuchtung für Tisch und Figuren; die Raumtexturen enthalten bereits ihr Licht. */
    const ROOM_LIGHT = {
      background: 0xd6d1c4,
      exposure: 1.02,
      ambient: { color: 0xf5e0c8, intensity: 0.2 },
      hemi: { sky: 0xf8eee4, ground: 0x4c4036, intensity: 0.5 },
      key: { color: 0xffd6a0, intensity: 0.75, pos: [2.2, 2.7, -1.2] },
      fill: { color: 0xa8c8f0, intensity: 0.38, pos: [-0.8, 1.6, 2.2] },
      rim: { color: 0xffa870, intensity: 0.32, pos: [-2.0, 0.7, -1.6] },
    };
    (function applyRoomLight() {
      const p = ROOM_LIGHT;
      const { ambient, hemi, key, fill, rim } = cozyLightRig;
      scene.background = new THREE.Color(p.background);
      renderer.toneMappingExposure = p.exposure;
      ambient.color.setHex(p.ambient.color);
      ambient.intensity = p.ambient.intensity;
      hemi.color.setHex(p.hemi.sky);
      hemi.groundColor.setHex(p.hemi.ground);
      hemi.intensity = p.hemi.intensity;
      key.color.setHex(p.key.color);
      key.intensity = p.key.intensity;
      key.position.set(...p.key.pos);
      fill.color.setHex(p.fill.color);
      fill.intensity = p.fill.intensity;
      fill.position.set(...p.fill.pos);
      rim.color.setHex(p.rim.color);
      rim.intensity = p.rim.intensity;
      rim.position.set(...p.rim.pos);
    })();

    const seam = 0.06;
    const Ww = W_ROOM;
    const Hh = H_ROOM_HALF;
    const Dd = W_ROOM;

    function buildQuadGeometry(corners) {
      const [v0, v1, v2, v3] = corners;
      const positions = new Float32Array([
        ...v0, ...v1, ...v2,
        ...v0, ...v2, ...v3,
      ]);
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.computeVertexNormals();
      return geo;
    }

    function setQuadUVs(geometry, uMin, uMax, vMin, vMax) {
      const uvs = new Float32Array([
        uMin, vMin, uMax, vMin, uMax, vMax,
        uMin, vMin, uMax, vMax, uMin, vMax,
      ]);
      geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
      geometry.attributes.uv.needsUpdate = true;
    }

    async function loadWinterRoomTextures() {
      const loader = new THREE.TextureLoader();
      const keys = Object.keys(WINTER_ROOM_TEXTURES);
      const map = {};
      for (const key of keys) {
        const dataUrl = WINTER_ROOM_TEXTURES[key];
        try {
          // eslint-disable-next-line no-await-in-loop
          map[key] = await new Promise((resolve, reject) => {
            loader.load(
              dataUrl,
              (tex) => {
                tex.colorSpace = THREE.SRGBColorSpace;
                tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
                // Wie im Original: lineare Filterung ohne Mipmaps.
                tex.minFilter = tex.magFilter = THREE.LinearFilter;
                tex.generateMipmaps = false;
                resolve(tex);
              },
              undefined,
              reject,
            );
          });
        } catch (err) {
          console.warn('Winterraum-Textur konnte nicht geladen werden:', key, err);
        }
      }
      return map;
    }

    async function buildWinterRoom(texMap) {
      const wallDefs = [
        {
          name: 'windowWallBacking',
          corners: [[-Ww, -Hh, -Dd], [Ww, -Hh, -Dd], [Ww, Hh, -Dd], [-Ww, Hh, -Dd]],
          solid: [0.30, 0.34, 0.39],
        },
        {
          name: 'winterWindow',
          key: 'winterWindow',
          corners: [[-Ww - seam, -Hh, -Dd + 0.002], [Ww + seam, -Hh, -Dd + 0.002], [Ww + seam, Hh, -Dd + 0.002], [-Ww - seam, Hh, -Dd + 0.002]],
        },
        {
          name: 'winterDoor',
          key: 'winterDoor',
          corners: [[-Ww + seam, -Hh, Dd + seam], [-Ww + seam, -Hh, -Dd - seam], [-Ww + seam, Hh, -Dd - seam], [-Ww + seam, Hh, Dd + seam]],
          uMin: 0.018,
        },
        {
          name: 'winterSlats',
          key: 'winterSlats',
          corners: [[Ww - seam, -Hh, -Dd - seam], [Ww - seam, -Hh, Dd + seam], [Ww - seam, Hh, Dd + seam], [Ww - seam, Hh, -Dd - seam]],
          uMin: 0.016,
          vMax: 0.988,
        },
        {
          name: 'winterShelf',
          key: 'winterShelf',
          corners: [[Ww + seam, -Hh, Dd + 0.002], [-Ww - seam, -Hh, Dd + 0.002], [-Ww - seam, Hh, Dd + 0.002], [Ww + seam, Hh, Dd + 0.002]],
          vMax: 0.988,
        },
        {
          name: 'floor',
          key: 'floor',
          corners: [[-Ww, -Hh, -Dd], [Ww, -Hh, -Dd], [Ww, -Hh, Dd], [-Ww, -Hh, Dd]],
        },
        {
          name: 'ceiling',
          key: 'ceiling',
          corners: [[-Ww, Hh, Dd], [Ww, Hh, Dd], [Ww, Hh, -Dd], [-Ww, Hh, -Dd]],
        },
      ];

      for (const def of wallDefs) {
        let uMin = def.uMin ?? 0;
        let uMax = 1;
        let vMin = 0;
        let vMax = def.vMax ?? 1;
        // V20 gibt die Texturfarben direkt aus: Licht und Schatten sind bereits
        // im Bild enthalten. Zusätzliche Beleuchtung oder ACES würde sie verfälschen.
        const mat = new THREE.MeshBasicMaterial({
          map: def.solid ? null : texMap[def.key] || null,
          color: def.solid
            ? new THREE.Color().setRGB(...def.solid, THREE.SRGBColorSpace)
            : 0xffffff,
          toneMapped: false,
          side: THREE.DoubleSide,
        });
        const geo = buildQuadGeometry(def.corners);
        setQuadUVs(geo, uMin, uMax, vMin, vMax);
        const mesh = new THREE.Mesh(geo, mat);
        mesh.name = def.name;
        scene.add(mesh);
      }
    }

    const texMapPromise = loadWinterRoomTextures().then(buildWinterRoom).catch((e) => {
      console.error('Winterraum konnte nicht aufgebaut werden:', e);
    });

    // V88 zeichnet die Holzfotos ohne zusätzliche Lichtfärbung.
    // Feste UVs und GPU-Perspektivkorrektur halten die Maserung beim Zoomen stabil.
    const tableTextureLoader = new THREE.TextureLoader();
    const tableAnisotropy = renderer.capabilities.getMaxAnisotropy();
    function tableMaterial(color, textureKey) {
      const material = new THREE.MeshBasicMaterial({
        color, toneMapped: false, side: THREE.DoubleSide,
      });
      if (textureKey) {
        const source = window.TABLE_TEXTURES?.[textureKey];
        if (!source) throw new Error(`Tischtextur fehlt: ${textureKey} (table-textures.js)`);
        tableTextureLoader.load(source, (texture) => {
          texture.colorSpace = THREE.SRGBColorSpace;
          texture.wrapS = texture.wrapT = THREE.ClampToEdgeWrapping;
          texture.magFilter = THREE.LinearFilter;
          texture.minFilter = THREE.LinearMipmapLinearFilter;
          texture.generateMipmaps = true;
          texture.anisotropy = tableAnisotropy;
          material.map = texture;
          material.color.setHex(0xffffff);
          material.needsUpdate = true;
        }, undefined, (error) => {
          console.error(`Tischtextur konnte nicht geladen werden: ${textureKey}`, error);
        });
      }
      return material;
    }
    const tableTop = tableMaterial('#a97749', 'top');
    const tableSide = tableMaterial('#754b2c', 'tableSide');
    const tableLeg = tableMaterial('#79502f', 'leg');
    const boardTop = tableMaterial('#d8bd8d', 'board');
    const boardEdge = tableMaterial('#b29568', 'edgeStrip');
    const legTop = tableMaterial('#91633d');
    const underside = tableMaterial('#62452d');
    const boardBaseTop = tableMaterial('#b49767');
    const boardBaseFront = tableMaterial('#9e7c51');
    const boardBaseSide = tableMaterial('#a98758');

    const tableGroup = new THREE.Group();
    scene.add(tableGroup);

    function addBox(x1, x2, y1, y2, z1, z2, materials) {
      // Gleiche Eckpunkt- und Bildausrichtung wie die Canvas-Flächen der V88.
      // Jede Oberfläche existiert genau einmal; keine überlagerte Brett-Textur.
      const faces = [
        [[x1,y2,z1], [x2,y2,z1], [x2,y2,z2], [x1,y2,z2]],
        [[x1,y1,z1], [x2,y1,z1], [x2,y2,z1], [x1,y2,z1]],
        [[x2,y1,z1], [x2,y1,z2], [x2,y2,z2], [x2,y2,z1]],
        [[x1,y1,z2], [x2,y1,z2], [x2,y2,z2], [x1,y2,z2]],
        [[x1,y1,z1], [x1,y1,z2], [x1,y2,z2], [x1,y2,z1]],
        [[x1,y1,z1], [x2,y1,z1], [x2,y1,z2], [x1,y1,z2]],
      ];
      faces.forEach((corners, i) => {
        const geometry = buildQuadGeometry(corners);
        // Canvas-Bildursprung oben links, Three-Texturursprung unten links.
        setQuadUVs(geometry, 0, 1, 1, 0);
        const mesh = new THREE.Mesh(geometry, materials[i]);
        mesh.castShadow = true;
        tableGroup.add(mesh);
      });
    }

    function lw(py) { return py * S; }

    const leg = 0.24, inset = 1.68;
    const yLeg0 = localTableYToWorld(-1.48);
    const yLeg1 = localTableYToWorld(0.16);
    for (const xc of [-inset, inset]) {
      for (const zc of [-inset, inset]) {
        const lx1 = lw(xc - leg / 2), lx2 = lw(xc + leg / 2);
        const lz1 = lw(zc - leg / 2), lz2 = lw(zc + leg / 2);
        addBox(lx1, lx2, yLeg0, yLeg1, lz1, lz2, [legTop, tableLeg, tableLeg, tableLeg, tableLeg, underside]);
      }
    }

    const ttY0 = localTableYToWorld(0.19);
    const ttY1 = localTableYToWorld(0.52);
    const tw = lw(2);
    addBox(-tw, tw, ttY0, ttY1, -tw, tw, [tableTop, tableSide, tableSide, tableSide, tableSide, underside]);

    const b = B_BOARD_LOCAL;
    const bottom = 0.535, top = TOP_LOCAL;
    const bb0 = localTableYToWorld(0.52);
    const bb1 = localTableYToWorld(bottom);
    const bw = lw(b);
    addBox(-bw, bw, bb0, bb1, -bw, bw, [boardBaseTop, boardBaseFront, boardBaseSide, boardBaseFront, boardBaseSide, underside]);

    const be0 = localTableYToWorld(bottom);
    const be1 = localTableYToWorld(top);
    addBox(-bw, bw, be0, be1, -bw, bw, [boardTop, boardEdge, boardEdge, boardEdge, boardEdge, underside]);

    const boardPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -BOARD_TOP_Y);

    const figGeo = buildHumanV36Geometry();
    figGeo.computeBoundingBox();
    const figFootY = figGeo.boundingBox.min.y;
    const FIG_BB_MAX_Y = figGeo.boundingBox.max.y;

    // Nahtlose, längs verlaufende Fasern mit unregelmäßigen Jahresringen.
    function createFigureWoodTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      const pixels = ctx.createImageData(canvas.width, canvas.height);
      for (let y = 0; y < canvas.height; y++) {
        const v = y / canvas.height;
        for (let x = 0; x < canvas.width; x++) {
          const u = x / canvas.width * Math.PI * 2;
          const warp = 0.7 * Math.sin(v * 7 + Math.sin(u * 3))
            + 0.28 * Math.sin(v * 17 + Math.cos(u * 2));
          const grain = Math.sin(u * 22 + warp * 3);
          const fine = Math.sin(u * 91 + warp * 8);
          const pores = Math.sin(u * 173 + Math.sin(v * 53) * 0.6);
          const shade = Math.round(218 + grain * 17 + fine * 7 + pores * 3
            - 27 * Math.pow(Math.max(0, grain), 12));
          const i = (y * canvas.width + x) * 4;
          pixels.data[i] = pixels.data[i + 1] = pixels.data[i + 2] = shade;
          pixels.data[i + 3] = 255;
        }
      }
      ctx.putImageData(pixels, 0, 0);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.wrapS = THREE.RepeatWrapping;
      texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      return texture;
    }
    const figureWoodTexture = createFigureWoodTexture();

    const figMat = new THREE.MeshStandardMaterial({
      color: 0xd6aa73,
      map: figureWoodTexture,
      bumpMap: figureWoodTexture,
      bumpScale: 0.008,
      roughness: 0.72,
      metalness: 0,
    });
    // Augen: Im Original per Shader-Kreise in lokalem Raum. Three r169 mappt MeshStandard auf
    // Physical-Shader – onBeforeCompile-Hooks trafen zuverlässig nicht die finale Farbe.
    // Zwei kleine Kugeln an denselben Koordinaten wie die Original-Augenzentren (sichtbare Hemisphäre z>0.245).
    const eyeBallRadius = 0.027;
    const eyeGeo = new THREE.SphereGeometry(eyeBallRadius, 16, 12);
    const eyeMatTemplate = new THREE.MeshBasicMaterial({ color: 0x0c0a09 });
    const EYE_Y = 1.925;
    const EYE_X = 0.092;
    const EYE_R_PROFILE = 0.30;
    const EYE_Z = Math.sqrt(Math.max(0, EYE_R_PROFILE * EYE_R_PROFILE - EYE_X * EYE_X));

    function attachFigurineEyes(parentMesh) {
      for (const sign of [-1, 1]) {
        const eye = new THREE.Mesh(eyeGeo, eyeMatTemplate.clone());
        eye.position.set(sign * EYE_X, EYE_Y, EYE_Z);
        eye.renderOrder = 2;
        eye.userData.isContrastMark = true;
        eye.material.toneMapped = false;
        parentMesh.add(eye);
      }
    }

    // Aufgedruckte Kopfmarkierung auf der gewölbten Oberfläche, Spitze nach lokal +Z.
    const FACING_DIR = new THREE.Vector3(0, 0, 1);
    const headMarkCanvas = document.createElement('canvas');
    headMarkCanvas.width = headMarkCanvas.height = 256;
    const headMarkContext = headMarkCanvas.getContext('2d');
    headMarkContext.fillStyle = '#ffffff';
    headMarkContext.beginPath();
    headMarkContext.moveTo(128, 32);
    headMarkContext.lineTo(193, 112);
    headMarkContext.lineTo(150, 112);
    headMarkContext.lineTo(150, 215);
    headMarkContext.lineTo(106, 215);
    headMarkContext.lineTo(106, 112);
    headMarkContext.lineTo(63, 112);
    headMarkContext.closePath();
    headMarkContext.fill();
    const headMarkTexture = new THREE.CanvasTexture(headMarkCanvas);
    headMarkTexture.colorSpace = THREE.SRGBColorSpace;
    headMarkTexture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());

    function attachHeadMark(parentMesh) {
      // Identische Kopfkontur verhindert eine schwebende, flache Pfeilfläche.
      const geometry = figGeo.clone();
      const positions = geometry.getAttribute('position');
      const uv = geometry.getAttribute('uv');
      const indices = [];
      for (let i = 0; i < positions.count; i++) {
        uv.setXY(i, 0.5 + positions.getX(i) / 0.44, 0.5 + positions.getZ(i) / 0.44);
      }
      for (let i = 0; i < geometry.index.count; i += 3) {
        const triangle = [geometry.index.getX(i), geometry.index.getX(i + 1), geometry.index.getX(i + 2)];
        if (triangle.every((v) => positions.getY(v) > 2.16)) indices.push(...triangle);
      }
      geometry.setIndex(indices);
      const material = new THREE.MeshBasicMaterial({
        map: headMarkTexture,
        color: 0x000000,
        toneMapped: false,
        transparent: true,
        depthWrite: false,
        polygonOffset: true,
        polygonOffsetFactor: -2,
        polygonOffsetUnits: -2,
      });
      const mark = new THREE.Mesh(geometry, material);
      mark.renderOrder = 2;
      mark.userData.isContrastMark = true;
      mark.raycast = () => {};
      parentMesh.add(mark);
      parentMesh.userData.facingDirLocal = FACING_DIR.clone();
    }

    /** Figurensicht: Mitte zwischen den Augen, Blick wie Pfeil (+lokal Z); nur umschauen, kein Zoom/Pan */
    let figureViewPlacement = null;
    let figureViewYaw = 0;
    let figureViewPitch = 0;
    let figureViewLookDrag = null;
    const _fvEyeL = new THREE.Vector3();
    const _fvEyeR = new THREE.Vector3();
    const _fvEyeMid = new THREE.Vector3();
    const _fvFwdBase = new THREE.Vector3();
    const _fvFwd = new THREE.Vector3();
    const _fvRight = new THREE.Vector3();
    const _fvUp = new THREE.Vector3(0, 1, 0);
    const _fvQuat = new THREE.Quaternion();

    function exitFigureView() {
      figureViewPlacement = null;
      figureViewLookDrag = null;
      camera.position.copy(startCameraPos);
      camera.quaternion.copy(startCameraQuat);
      controls.target.copy(startControlsTarget);
      camera.up.set(0, 1, 0);
      controls.enabled = true;
      controls.enableZoom = true;
      controls.enablePan = true;
      ensureSelectionRing();
      syncSelectionRingVisual();
      const ex = document.getElementById('exit-figure-view');
      if (ex) ex.style.display = 'none';
    }

    function enterFigureView(p) {
      if (!p?.group?.userData?.mesh) return;
      figureViewPlacement = p;
      figureViewYaw = 0;
      figureViewPitch = 0;
      controls.enabled = false;
      controls.enableZoom = false;
      controls.enablePan = false;
      updateFigureViewCamera();
      ensureSelectionRing();
      syncSelectionRingVisual();
      const ex = document.getElementById('exit-figure-view');
      if (ex) ex.style.display = 'block';
    }

    function updateFigureViewCamera() {
      if (!figureViewPlacement) return;
      const mesh = figureViewPlacement.group.userData.mesh;
      mesh.updateWorldMatrix(true, true);
      _fvEyeL.set(-EYE_X, EYE_Y, EYE_Z).applyMatrix4(mesh.matrixWorld);
      _fvEyeR.set(EYE_X, EYE_Y, EYE_Z).applyMatrix4(mesh.matrixWorld);
      _fvEyeMid.copy(_fvEyeL).add(_fvEyeR).multiplyScalar(0.5);
      mesh.getWorldQuaternion(_fvQuat);
      _fvFwdBase.set(0, 0, 1).applyQuaternion(_fvQuat).normalize();
      const bx = _fvFwdBase.x;
      const by = _fvFwdBase.y;
      const bz = _fvFwdBase.z;
      const cosY = Math.cos(figureViewYaw);
      const sinY = Math.sin(figureViewYaw);
      _fvFwd.set(
        bx * cosY + bz * sinY,
        by,
        -bx * sinY + bz * cosY,
      ).normalize();
      _fvRight.crossVectors(_fvUp, _fvFwd);
      if (_fvRight.lengthSq() < 1e-10) _fvRight.set(1, 0, 0);
      else _fvRight.normalize();
      _fvFwd.applyAxisAngle(_fvRight, figureViewPitch).normalize();
      camera.position.copy(_fvEyeMid);
      camera.up.copy(_fvUp);
      camera.lookAt(_fvEyeMid.x + _fvFwd.x, _fvEyeMid.y + _fvFwd.y, _fvEyeMid.z + _fvFwd.z);
    }

    document.getElementById('exit-figure-view').addEventListener('click', () => exitFigureView());

    // Die neutrale Maserung bleibt auch unter farbiger Holzbeize sichtbar.
    const FIGURE_COLORS = [
      { name: 'Naturholz (Standard)', hex: null, group: 'Hell' },
      { name: 'Weiß', hex: 0xffffff, group: 'Hell' },
      { name: 'Gelb', hex: 0xe3ba55, group: 'Hell' },
      { name: 'Orange', hex: 0xd68b46, group: 'Hell' },
      { name: 'Rot', hex: 0xc45149, group: 'Dunkel' },
      { name: 'Blau', hex: 0x477fb5, group: 'Dunkel' },
      { name: 'Grün', hex: 0x658552, group: 'Dunkel' },
      { name: 'Violett', hex: 0x9569a6, group: 'Dunkel' },
    ];

    function setFigureColor(mesh, hex) {
      if (mesh.userData.figureType === 'light') { tintLightFigure(mesh, hex); return; }
      mesh.material.color.setHex(hex ?? 0xd6aa73);
      const color = FIGURE_COLORS.find((c) => c.hex === hex);
      const contrast = color?.group === 'Dunkel' ? 0xffffff : 0x000000;
      mesh.children.forEach((child) => {
        if (child.userData.isContrastMark) child.material.color.setHex(contrast);
      });
    }

    // Vorschauen durch dieselbe Render-Pipeline statt CSS-Farbmultiplikation.
    function createFigureMesh(type) {
      if (type === 'light') return createLightFigure(FIG_BB_MAX_Y - figFootY);
      const mesh = new THREE.Mesh(figGeo, figMat.clone());
      mesh.userData.figureType = 'human';
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      attachFigurineEyes(mesh);
      attachHeadMark(mesh);
      return mesh;
    }

    function createColorPreviews(type) {
      const previewRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      previewRenderer.setSize(96, 96);
      previewRenderer.setPixelRatio(1);
      previewRenderer.outputColorSpace = renderer.outputColorSpace;
      previewRenderer.toneMapping = renderer.toneMapping;
      previewRenderer.toneMappingExposure = renderer.toneMappingExposure;
      const previewScene = new THREE.Scene();
      for (const light of Object.values(cozyLightRig)) {
        const copy = light.clone();
        copy.castShadow = false;
        previewScene.add(copy);
      }
      const previewCamera = new THREE.PerspectiveCamera(35, 1, 0.01, 20);
      previewCamera.position.set(0.28, 0.24, 0.64);
      previewCamera.lookAt(0, 0.12, 0);
      const mesh = createFigureMesh(type);
      mesh.scale.setScalar(FIGURE_SCALE_M);
      previewScene.add(mesh);
      const previews = new Map();
      for (const color of FIGURE_COLORS) {
        setFigureColor(mesh, color.hex);
        previewRenderer.render(previewScene, previewCamera);
        previews.set(color.hex, previewRenderer.domElement.toDataURL());
      }
      mesh.children.forEach((child) => {
        child.material.dispose();
        if (child.geometry !== eyeGeo) child.geometry.dispose();
      });
      mesh.material.dispose();
      if (mesh.geometry !== figGeo) mesh.geometry.dispose();
      previewRenderer.dispose();
      previewRenderer.forceContextLoss();
      return previews;
    }
    const figureColorPreviews = new Map();

    function updateColorSwatch(button, hex, type = 'human') {
      if (!figureColorPreviews.has(type)) figureColorPreviews.set(type, createColorPreviews(type));
      const color = FIGURE_COLORS.find((c) => c.hex === hex);
      button.style.backgroundImage = `url(${figureColorPreviews.get(type).get(hex)})`;
      const colorName = hex == null && type === 'light' ? 'Originallicht (Standard)' : color.name;
      button.title = colorName;
      button.setAttribute('aria-label', button.classList.contains('figure-color-trigger')
        ? `Farbe wählen: ${colorName}` : colorName);
    }

    const figuresRoot = new THREE.Group();
    scene.add(figuresRoot);

    let figureId = 0;
    const placements = [];

    /** Auswahl: Sidebar + gedämpftes Highlight; Drehen nur über Ring-Griff am Brett */
    let selectedFigureId = null;
    const SELECTION_ACCENT = 0x5a8f88;

    const SELECTION_RING_RADIUS = 0.105; /* Basis bei Größe M */
    /** Leicht über der Brettfläche, damit Raycasts den Griff treffen (nicht zuerst die Platte) */
    const SELECTION_RING_Y = 0.028;
    let selectionRingBuilt = null;

    function ensureSelectionRing() {
      if (selectionRingBuilt) return selectionRingBuilt;
      const group = new THREE.Group();
      group.name = 'selectionRing';
      const ringThick = 0.0024;
      const ringGeo = new THREE.RingGeometry(
        SELECTION_RING_RADIUS - ringThick,
        SELECTION_RING_RADIUS + ringThick,
        72,
      );
      const ringMat = new THREE.MeshBasicMaterial({
        color: SELECTION_ACCENT,
        transparent: true,
        opacity: 0.38,
        side: THREE.DoubleSide,
        depthWrite: false,
      });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = -Math.PI / 2;
      ring.position.y = SELECTION_RING_Y;
      ring.renderOrder = 1;
      ring.raycast = () => {};
      group.add(ring);

      const handleMat = new THREE.MeshBasicMaterial({
        color: SELECTION_ACCENT,
        transparent: true,
        opacity: 0.92,
        depthTest: true,
      });
      /** Pivot um Y: Kegel fest bei +lokal Z (= R nach vorne), rotiert mit Figuren-Blickrichtung */
      const handlePivot = new THREE.Group();
      handlePivot.position.y = SELECTION_RING_Y + 0.004;
      const handle = new THREE.Mesh(new THREE.ConeGeometry(0.022, 0.052, 10), handleMat);
      handle.rotation.x = Math.PI / 2;
      handle.position.z = SELECTION_RING_RADIUS;
      handle.renderOrder = 2;
      handle.userData.isSelectionRingHandle = true;
      handlePivot.add(handle);
      group.add(handlePivot);

      scene.add(group);
      selectionRingBuilt = { group, handlePivot, handle, ring };
      return selectionRingBuilt;
    }

    function getPlacementById(id) {
      return placements.find((p) => p.id === id) ?? null;
    }

    function syncSelectionRingVisual() {
      const parts = selectionRingBuilt;
      if (!parts) return;
      const p = selectedFigureId != null ? getPlacementById(selectedFigureId) : null;
      if (!p || figureViewPlacement) {
        parts.group.visible = false;
        return;
      }
      parts.group.visible = true;
      const root = p.group;
      const ry = root.rotation.y;
      const sizeMult = selectionRingScaleForPlacement(p);
      const ringR = SELECTION_RING_RADIUS * sizeMult;
      parts.group.position.set(root.position.x, BOARD_TOP_Y, root.position.z);
      parts.ring.scale.set(sizeMult, sizeMult, sizeMult);
      parts.handle.position.z = ringR;
      parts.handlePivot.rotation.y = ry;
    }

    function updateFigureMeshHighlights() {
      // Auswahl wird durch Bodenring und Menürahmen angezeigt, ohne die Holzfarbe zu verändern.
      for (const p of placements) {
        p.group.userData.mesh.material.emissive?.setHex(0x000000);
      }
    }

    function setSelectedFigureId(id) {
      selectedFigureId = id;
      ensureSelectionRing();
      updateFigureMeshHighlights();
      syncSelectionRingVisual();
      document.querySelectorAll('#fig-list li.figure-row').forEach((li) => {
        const rowId = Number(li.dataset.id);
        li.classList.toggle('is-selected', Number.isFinite(rowId) && rowId === selectedFigureId);
      });
    }

    const figureBoardBounds = new THREE.Box3();

    function clampToBoard(x, z, root) {
      const mesh = root.userData.mesh;
      mesh.updateWorldMatrix(true, false);
      // Weltkoordinaten der gedrehten und skalierten Figur-Bounding-Box.
      // Auswahlring und andere Bedienhilfen gehören nicht zur Grundfläche.
      figureBoardBounds.copy(mesh.geometry.boundingBox).applyMatrix4(mesh.matrixWorld);
      const minX = -BOARD_HALF - (figureBoardBounds.min.x - root.position.x);
      const maxX = BOARD_HALF - (figureBoardBounds.max.x - root.position.x);
      const minZ = -BOARD_HALF - (figureBoardBounds.min.z - root.position.z);
      const maxZ = BOARD_HALF - (figureBoardBounds.max.z - root.position.z);
      return {
        x: THREE.MathUtils.clamp(x, minX, maxX),
        z: THREE.MathUtils.clamp(z, minZ, maxZ),
      };
    }

    function closeAllColorDropdowns() {
      document.querySelectorAll('#fig-list .figure-color-dropdown.is-open').forEach((el) => el.classList.remove('is-open'));
      document.querySelectorAll('#fig-list .figure-color-trigger[aria-expanded="true"]').forEach((el) => el.setAttribute('aria-expanded', 'false'));
    }

    function closeAllSizeDropdowns() {
      document.querySelectorAll('#fig-list .figure-size-dropdown.is-open').forEach((el) => el.classList.remove('is-open'));
      document.querySelectorAll('#fig-list .figure-size-trigger[aria-expanded="true"]').forEach((el) => el.setAttribute('aria-expanded', 'false'));
    }

    function closeAllFigurePickers() {
      closeAllColorDropdowns();
      closeAllSizeDropdowns();
    }

    document.addEventListener('pointerdown', (ev) => {
      if (ev.target.closest('.figure-color-wrap') || ev.target.closest('.figure-size-wrap')) return;
      closeAllFigurePickers();
    });

    function refreshFigureList() {
      const ul = document.getElementById('fig-list');
      ul.innerHTML = '';
      if (!placements.length) {
        selectedFigureId = null;
        updateFigureMeshHighlights();
        ensureSelectionRing();
        syncSelectionRingVisual();
        const li = document.createElement('li');
        li.style.cssText = 'opacity:0.55;padding:14px;font-size:14px;';
        li.textContent = 'Noch keine Figur';
        ul.appendChild(li);
        return;
      }
      if (selectedFigureId != null && !placements.some((x) => x.id === selectedFigureId)) {
        selectedFigureId = null;
      }
      for (const p of placements) {
        const li = document.createElement('li');
        li.className = 'figure-row';
        li.dataset.id = String(p.id);
        if (p.id === selectedFigureId) li.classList.add('is-selected');

        const colorWrap = document.createElement('div');
        colorWrap.className = 'figure-color-wrap';

        const trigger = document.createElement('button');
        trigger.type = 'button';
        trigger.className = 'figure-color-trigger';
        trigger.title = 'Farbe wählen';
        trigger.setAttribute('aria-label', 'Farbe wählen');
        trigger.setAttribute('aria-expanded', 'false');
        updateColorSwatch(trigger, p.woodColor, p.type);

        const dropdown = document.createElement('div');
        dropdown.className = 'figure-color-dropdown';
        dropdown.setAttribute('role', 'listbox');

        for (const c of FIGURE_COLORS) {
          const opt = document.createElement('button');
          opt.type = 'button';
          opt.className = 'figure-color-opt';
          opt.title = c.name;
          opt.setAttribute('aria-label', c.name);
          updateColorSwatch(opt, c.hex, p.type);
          opt.textContent = c.hex == null && p.type === 'light' ? 'Originallicht (Standard)' : c.name;
          opt.setAttribute('role', 'option');
          opt.setAttribute('aria-selected', String(p.woodColor === c.hex));
          opt.addEventListener('click', (e) => {
            e.stopPropagation();
            p.woodColor = c.hex;
            setFigureColor(p.group.userData.mesh, c.hex);
            updateColorSwatch(trigger, c.hex, p.type);
            dropdown.querySelectorAll('[role=option]').forEach((item) => item.setAttribute('aria-selected', String(item === opt)));
            dropdown.classList.remove('is-open');
            trigger.setAttribute('aria-expanded', 'false');
          });
          dropdown.appendChild(opt);
        }

        trigger.addEventListener('click', (e) => {
          e.stopPropagation();
          const open = dropdown.classList.toggle('is-open');
          if (open) {
            closeAllSizeDropdowns();
            document.querySelectorAll('#fig-list .figure-color-dropdown.is-open').forEach((d) => {
              if (d !== dropdown) d.classList.remove('is-open');
            });
            trigger.setAttribute('aria-expanded', 'true');
          } else {
            trigger.setAttribute('aria-expanded', 'false');
          }
        });

        colorWrap.appendChild(trigger);
        colorWrap.appendChild(dropdown);

        const sizeWrap = document.createElement('div');
        sizeWrap.className = 'figure-size-wrap';

        const sizeTrigger = document.createElement('button');
        sizeTrigger.type = 'button';
        sizeTrigger.className = 'figure-size-trigger';
        const currentSize = p.size ?? 1;
        sizeTrigger.textContent = formatFigureSize(currentSize);
        sizeTrigger.title = 'Größe wählen';
        sizeTrigger.setAttribute('aria-label', 'Größe wählen');
        sizeTrigger.setAttribute('aria-expanded', 'false');

        const sizeDropdown = document.createElement('div');
        sizeDropdown.className = 'figure-size-dropdown';
        const sizeLabel = document.createElement('label');
        sizeLabel.className = 'figure-size-label';
        sizeLabel.htmlFor = `figure-size-${p.id}`;
        sizeLabel.textContent = 'Größe';
        const sizeValue = document.createElement('output');
        sizeValue.htmlFor = sizeLabel.htmlFor;
        sizeValue.textContent = formatFigureSize(currentSize);
        sizeLabel.appendChild(sizeValue);

        const sizeSlider = document.createElement('input');
        sizeSlider.type = 'range';
        sizeSlider.id = sizeLabel.htmlFor;
        sizeSlider.className = 'figure-size-slider';
        sizeSlider.min = String(FIGURE_SIZE_MIN);
        sizeSlider.max = String(FIGURE_SIZE_MAX);
        sizeSlider.step = 'any';
        sizeSlider.value = String(currentSize);
        sizeSlider.setAttribute('aria-valuetext', formatFigureSize(currentSize));
        sizeSlider.addEventListener('input', () => {
          p.size = Number(sizeSlider.value);
          applyFigureSize(p);
          const label = formatFigureSize(p.size);
          sizeTrigger.textContent = label;
          sizeValue.textContent = label;
          sizeSlider.setAttribute('aria-valuetext', label);
        });
        sizeSlider.addEventListener('click', (e) => e.stopPropagation());
        const sizeLimits = document.createElement('div');
        sizeLimits.className = 'figure-size-limits';
        const minLabel = document.createElement('span');
        minLabel.textContent = '0,5×';
        const maxLabel = document.createElement('span');
        maxLabel.textContent = '2×';
        sizeLimits.append(minLabel, maxLabel);
        sizeDropdown.append(sizeLabel, sizeSlider, sizeLimits);

        sizeTrigger.addEventListener('click', (e) => {
          e.stopPropagation();
          const open = sizeDropdown.classList.toggle('is-open');
          if (open) {
            closeAllColorDropdowns();
            document.querySelectorAll('#fig-list .figure-size-dropdown.is-open').forEach((d) => {
              if (d !== sizeDropdown) d.classList.remove('is-open');
            });
            sizeTrigger.setAttribute('aria-expanded', 'true');
          } else {
            sizeTrigger.setAttribute('aria-expanded', 'false');
          }
        });

        sizeWrap.appendChild(sizeTrigger);
        sizeWrap.appendChild(sizeDropdown);

        const nameInput = document.createElement('input');
        nameInput.type = 'text';
        nameInput.className = 'figure-name-input';
        nameInput.value = p.name;
        nameInput.setAttribute('aria-label', 'Name der Figur');
        nameInput.addEventListener('change', () => {
          p.name = nameInput.value.trim() || `Figur ${p.id}`;
          nameInput.value = p.name;
        });
        nameInput.addEventListener('blur', () => {
          p.name = nameInput.value.trim() || `Figur ${p.id}`;
          nameInput.value = p.name;
        });

        const viewBtn = document.createElement('button');
        viewBtn.type = 'button';
        viewBtn.className = 'btn-figure-view';
        viewBtn.title = 'Figurensicht';
        viewBtn.setAttribute('aria-label', 'Figurensicht');
        viewBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><ellipse cx="12" cy="12" rx="8" ry="4.5"/><circle cx="12" cy="12" r="2"/></svg>';
        viewBtn.addEventListener('click', () => {
          closeAllFigurePickers();
          setSelectedFigureId(p.id);
          enterFigureView(p);
        });

        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'btn-delete-icon';
        del.title = 'Löschen';
        del.setAttribute('aria-label', 'Figur löschen');
        del.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>';
        del.addEventListener('click', () => removeFigure(p.id));

        li.addEventListener('pointerdown', (ev) => {
          if (ev.button !== 0) return;
          const t = ev.target;
          if (t.closest('.figure-color-wrap') || t.closest('.figure-size-wrap') || t.closest('.btn-delete-icon') || t.closest('.btn-figure-view') || t.closest('.figure-name-input')) return;
          setSelectedFigureId(p.id);
        });

        li.appendChild(colorWrap);
        li.appendChild(sizeWrap);
        li.appendChild(nameInput);
        li.appendChild(viewBtn);
        li.appendChild(del);
        ul.appendChild(li);
      }
      updateFigureMeshHighlights();
      ensureSelectionRing();
      syncSelectionRingVisual();
    }

    function removeFigure(id) {
      if (figureViewPlacement && figureViewPlacement.id === id) exitFigureView();
      if (selectedFigureId === id) selectedFigureId = null;
      const idx = placements.findIndex((p) => p.id === id);
      if (idx < 0) return;
      const p = placements[idx];
      const mesh = p.group.userData.mesh;
      mesh.children.forEach((ch) => {
        if (ch.material) ch.material.dispose();
        if (ch.geometry && ch.geometry !== eyeGeo && ch.geometry !== figGeo) ch.geometry.dispose();
      });
      if (mesh.material) mesh.material.dispose();
      if (mesh.geometry !== figGeo) mesh.geometry.dispose();
      figuresRoot.remove(p.group);
      placements.splice(idx, 1);
      refreshFigureList();
    }

    function addFigure(type = 'human') {
      const group = new THREE.Group();
      const mesh = createFigureMesh(type);
      const defaultSize = 1;
      const meshScale = figureScaleForSize(defaultSize);
      mesh.scale.setScalar(meshScale);
      mesh.position.y = -mesh.geometry.boundingBox.min.y * meshScale;
      const defaultColor = null;
      setFigureColor(mesh, defaultColor);
      group.add(mesh);

      group.position.set(0, BOARD_TOP_Y, 0);
      const id = ++figureId;
      group.userData.figureId = id;
      group.userData.mesh = mesh;

      figuresRoot.add(group);
      placements.push({ group, id, type, woodColor: defaultColor, size: defaultSize, name: `${type === 'light' ? 'Leuchtfigur' : 'Mensch'} ${id}` });
      selectedFigureId = id;
      refreshFigureList();
      return group;
    }

    const addFigureWrap = document.getElementById('add-figure-wrap');
    const addFigureButton = document.getElementById('add-figure');
    const addFigureOptions = document.getElementById('add-figure-options');
    function setAddFigureOpen(open) {
      addFigureOptions.hidden = !open;
      addFigureButton.setAttribute('aria-expanded', String(open));
      if (open) closeAllFigurePickers();
    }
    addFigureButton.addEventListener('click', () => {
      setAddFigureOpen(addFigureOptions.hidden);
    });
    addFigureButton.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowDown') {
        event.preventDefault();
        setAddFigureOpen(true);
        addFigureOptions.querySelector('button').focus();
      }
    });
    addFigureOptions.querySelectorAll('button').forEach((button) => {
      button.addEventListener('click', () => {
        addFigure(button.dataset.figureType);
        setAddFigureOpen(false);
        addFigureButton.focus();
      });
    });
    addFigureWrap.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        setAddFigureOpen(false);
        addFigureButton.focus();
      }
    });
    addFigureWrap.addEventListener('focusout', (event) => {
      if (!addFigureWrap.contains(event.relatedTarget)) setAddFigureOpen(false);
    });
    document.addEventListener('pointerdown', (event) => {
      if (!addFigureWrap.contains(event.target)) setAddFigureOpen(false);
    });


    // --- Picking & Drag ---
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    let dragState = null;
    /** Kurzer Klick auf Figur = Auswahl; Ziehen = Verschieben; Drehen am Ring-Griff auf der Platte */
    let pendingFigurePick = null;
    const FIGURE_CLICK_MAX_PX = 8;

    function getFigureRoots() {
      return figuresRoot.children;
    }

    renderer.domElement.addEventListener('pointerdown', onPointerDown);
    renderer.domElement.addEventListener('pointermove', onPointerMove);
    renderer.domElement.addEventListener('pointerup', onPointerUp);
    renderer.domElement.addEventListener('pointercancel', onPointerUp);

    function boardPlaneAngleForRoot(root, ndcFromEvent) {
      raycaster.setFromCamera(ndcFromEvent, camera);
      const pt = new THREE.Vector3();
      if (!raycaster.ray.intersectPlane(boardPlane, pt)) return null;
      const lx = pt.x - root.position.x;
      const lz = pt.z - root.position.z;
      return Math.atan2(lx, lz);
    }

    function beginFigureDrag(e, root) {
      if (e.preventDefault) e.preventDefault();
      const fid = root.userData.figureId;
      if (fid != null) setSelectedFigureId(fid);
      const r = updatePointer(e);
      raycaster.setFromCamera(r, camera);
      controls.enabled = false;
      renderer.domElement.setPointerCapture(e.pointerId);

      dragState = {
        root,
        mode: 'move',
        pointerId: e.pointerId,
        startClientX: e.clientX,
        startClientY: e.clientY,
      };

      const planeHit = new THREE.Vector3();
      if (raycaster.ray.intersectPlane(boardPlane, planeHit)) {
        dragState.planeOffsetX = root.position.x - planeHit.x;
        dragState.planeOffsetZ = root.position.z - planeHit.z;
      } else {
        dragState.planeOffsetX = 0;
        dragState.planeOffsetZ = 0;
      }
    }

    function onPointerDown(e) {
      if (figureViewPlacement) {
        if (e.target !== renderer.domElement) return;
        e.preventDefault();
        figureViewLookDrag = { pointerId: e.pointerId, lastX: e.clientX, lastY: e.clientY };
        renderer.domElement.setPointerCapture(e.pointerId);
        return;
      }
      const r = updatePointer(e);
      raycaster.setFromCamera(r, camera);

      const hitObj = raycaster.intersectObjects(scene.children, true)[0]?.object;
      if (hitObj?.userData?.isSelectionRingHandle) {
        const p = getPlacementById(selectedFigureId);
        if (!p || figureViewPlacement) return;
        e.preventDefault();
        controls.enabled = false;
        renderer.domElement.setPointerCapture(e.pointerId);
        const ang = boardPlaneAngleForRoot(p.group, r);
        dragState = {
          mode: 'rotateRing',
          root: p.group,
          pointerId: e.pointerId,
          lastAngle: ang != null ? ang : p.group.rotation.y,
        };
        return;
      }

      const roots = getFigureRoots();
      const hits = raycaster.intersectObjects(roots, true);
      if (!hits.length) {
        if (e.button === 0) setSelectedFigureId(null);
        return;
      }

      let root = hits[0].object;
      while (root.parent && root.parent !== figuresRoot) root = root.parent;

      e.preventDefault();
      controls.enabled = false;
      renderer.domElement.setPointerCapture(e.pointerId);
      pendingFigurePick = {
        root,
        pointerId: e.pointerId,
        startX: e.clientX,
        startY: e.clientY,
      };
    }

    function updatePointer(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      return pointer;
    }

    function onPointerMove(e) {
      if (pendingFigurePick && e.pointerId === pendingFigurePick.pointerId && !dragState) {
        const dx = e.clientX - pendingFigurePick.startX;
        const dy = e.clientY - pendingFigurePick.startY;
        if (Math.hypot(dx, dy) >= FIGURE_CLICK_MAX_PX) {
          const pp = pendingFigurePick;
          pendingFigurePick = null;
          beginFigureDrag(
            {
              preventDefault: () => e.preventDefault(),
              clientX: e.clientX,
              clientY: e.clientY,
              pointerId: pp.pointerId,
            },
            pp.root,
          );
        }
      }
      if (figureViewLookDrag && e.pointerId === figureViewLookDrag.pointerId) {
        const dx = e.clientX - figureViewLookDrag.lastX;
        const dy = e.clientY - figureViewLookDrag.lastY;
        figureViewLookDrag.lastX = e.clientX;
        figureViewLookDrag.lastY = e.clientY;
        figureViewYaw -= dx * 0.005;
        figureViewPitch = THREE.MathUtils.clamp(
          figureViewPitch + dy * 0.005,
          -Math.PI / 2 + 0.12,
          Math.PI / 2 - 0.12,
        );
        updateFigureViewCamera();
        return;
      }
      if (!dragState || e.pointerId !== dragState.pointerId) return;
      const r = updatePointer(e);
      raycaster.setFromCamera(r, camera);

      if (dragState.mode === 'rotateRing') {
        const newAng = boardPlaneAngleForRoot(dragState.root, r);
        if (newAng == null) return;
        let d = newAng - dragState.lastAngle;
        if (d > Math.PI) d -= 2 * Math.PI;
        if (d < -Math.PI) d += 2 * Math.PI;
        dragState.root.rotation.y += d;
        dragState.lastAngle = newAng;
        syncSelectionRingVisual();
        return;
      }

      if (dragState.mode === 'move') {
        const pt = new THREE.Vector3();
        if (raycaster.ray.intersectPlane(boardPlane, pt)) {
          const x = pt.x + (dragState.planeOffsetX ?? 0);
          const z = pt.z + (dragState.planeOffsetZ ?? 0);
          const c = clampToBoard(x, z, dragState.root);
          dragState.root.position.x = c.x;
          dragState.root.position.z = c.z;
          dragState.root.position.y = BOARD_TOP_Y;
        }
        syncSelectionRingVisual();
      }
    }

    function onPointerUp(e) {
      if (figureViewLookDrag && e.pointerId === figureViewLookDrag.pointerId) {
        figureViewLookDrag = null;
        try { renderer.domElement.releasePointerCapture(e.pointerId); } catch (_) {}
        return;
      }
      if (pendingFigurePick && e.pointerId === pendingFigurePick.pointerId && !dragState) {
        const pp = pendingFigurePick;
        pendingFigurePick = null;
        const dx = e.clientX - pp.startX;
        const dy = e.clientY - pp.startY;
        try { renderer.domElement.releasePointerCapture(e.pointerId); } catch (_) {}
        if (Math.hypot(dx, dy) < FIGURE_CLICK_MAX_PX) {
          const fid = pp.root.userData.figureId;
          if (fid != null) setSelectedFigureId(fid);
        }
        controls.enabled = !figureViewPlacement;
        return;
      }
      if (!dragState || e.pointerId !== dragState.pointerId) return;
      dragState = null;
      controls.enabled = !figureViewPlacement;
      syncSelectionRingVisual();
      try { renderer.domElement.releasePointerCapture(e.pointerId); } catch (_) {}
    }

    renderer.domElement.addEventListener('wheel', (ev) => {
      if (figureViewPlacement) ev.preventDefault();
    }, { passive: false });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    addFigure();

    function animate() {
      requestAnimationFrame(animate);
      if (figureViewPlacement) updateFigureViewCamera();
      else controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
