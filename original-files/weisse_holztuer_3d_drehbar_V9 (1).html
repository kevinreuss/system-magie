<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Digitale 3D-Holztür</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dedbd6;font-family:Arial,sans-serif}#scene{width:100%;height:100%;display:block;touch-action:none}#panel{position:fixed;left:12px;top:12px;max-width:calc(100vw - 48px);background:#ffffffdf;padding:10px 12px;border-radius:10px;color:#333;font-size:14px;box-shadow:0 2px 10px #0002}#panel strong{display:block;margin-bottom:4px}#hint{font-size:12px;color:#555;margin-top:4px}button{border:0;border-radius:6px;padding:8px 10px;margin:7px 4px 0 0;background:#eee;color:#222;font-size:13px}button.active{background:#c25735;color:white}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="panel"><strong>3D-Holztür mit Rahmen</strong>Mit dem Finger ziehen: Kamera um die Tür bewegen.<div id="hint">Weiße Holztür mit Rahmen, leicht geöffnet. Die Tür steht fest auf der Fläche.</div><button id="reset">Ansicht zurücksetzen</button><button id="doorMode">Tür öffnen/schließen</button><button id="spin">Automatisch drehen</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const canvas=document.querySelector('#scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=false;renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color(0xdedbd6);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);
scene.add(new THREE.HemisphereLight(0xffffff,0x71665c,1.35));const key=new THREE.DirectionalLight(0xfff5e9,2.0);key.position.set(-4,8,6);key.castShadow=false;scene.add(key);const fill=new THREE.DirectionalLight(0xffffff,.7);fill.position.set(5,3,-5);scene.add(fill);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0xdedbd6,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=0;floor.receiveShadow=false;scene.add(floor);
const doorGroup=new THREE.Group();scene.add(doorGroup);
// Dezente, vertikale Holzmaserung als nahtlose Textur – weiß lackiertes Holz, keine groben Streifen.
const grainCanvas=document.createElement('canvas');grainCanvas.width=256;grainCanvas.height=512;
const gctx=grainCanvas.getContext('2d');
gctx.fillStyle='#f7f4ed';gctx.fillRect(0,0,256,512);
// Feine, aber erkennbare Maserung unter weißem Lack: lange, leicht wellige Holzfasern.
for(let x=0;x<256;x+=2){
 const wave=Math.sin(x*.075)*3.2+Math.sin(x*.021)*4.5+Math.sin(x*.19)*.8;
 const alpha=.045+((Math.sin(x*.31)+1)*.018);
 gctx.strokeStyle=`rgba(139,119,91,${alpha})`;
 gctx.lineWidth=.7+(Math.sin(x*.13)+1)*.45;
 gctx.beginPath();gctx.moveTo(x+wave,0);gctx.bezierCurveTo(x+wave-3,140,x+wave+4,350,x+wave+1,512);gctx.stroke();
}
// Sehr zarte unregelmäßige Jahreslinien geben dem lackierten Holz etwas Tiefe.
for(let k=0;k<9;k++){
 const x=18+k*27;
 gctx.strokeStyle='rgba(166,146,116,0.075)';gctx.lineWidth=1.2;
 gctx.beginPath();gctx.moveTo(x,0);gctx.bezierCurveTo(x-7,160,x+8,330,x-2,512);gctx.stroke();
}
const grainTexture=new THREE.CanvasTexture(grainCanvas);grainTexture.colorSpace=THREE.SRGBColorSpace;
grainTexture.wrapS=grainTexture.wrapT=THREE.RepeatWrapping;grainTexture.repeat.set(1,1);
const white=new THREE.MeshStandardMaterial({color:0xfaf8f2,map:grainTexture,roughness:.82,side:THREE.DoubleSide});
const whiteEdge=new THREE.MeshStandardMaterial({color:0xe1dcd1,map:grainTexture,roughness:.86,side:THREE.DoubleSide});
const woodLine=new THREE.MeshStandardMaterial({color:0xd4d0c7,roughness:.9});
const metal=new THREE.MeshStandardMaterial({color:0x9a9a96,metalness:.65,roughness:.32});
function block(parent,w,h,d,mat,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=false;m.receiveShadow=false;parent.add(m);return m;}
// Rahmen: zwei senkrechte Pfosten, oberer Querholm und dezente innere Falz.
const H=3.05,W=1.72,frame=0.14,depth=.18;
block(doorGroup,frame,H,depth,-0===1?white:white,-W/2+frame/2,H/2,0);
block(doorGroup,frame,H,depth,white,W/2-frame/2,H/2,0);
block(doorGroup,W,frame,depth,white,0,H-frame/2,0);
// Sauberer unterer Querholm schließt den Türrahmen ab; die Schwelle liegt flach am Boden.
block(doorGroup,W,frame,depth,white,0,frame/2,0);
block(doorGroup,W,0.055,.22,whiteEdge,0,.0275,0);
// Scharnierachse links: Türblatt dreht um die linke Türkante, steht etwa 18° offen.
const hinge=new THREE.Group();
// Türblatt exakt in die lichte Öffnung setzen: Abstand zum oberen und unteren Querholm.
const openingBottom=frame+.012;
hinge.position.set(-W/2+frame,openingBottom,0);doorGroup.add(hinge);
const doorW=W-2*frame-.035,doorH=H-2*frame-.024,doorD=.075;
// Türblatt als echte ausgeschnittene Geometrie: das Herz ist ein Loch durch das gesamte Holz.
const doorShape=new THREE.Shape();
doorShape.moveTo(0,0);doorShape.lineTo(doorW,0);doorShape.lineTo(doorW,doorH);doorShape.lineTo(0,doorH);doorShape.closePath();
// Vierblättriges Kleeblatt als echte Durchgangsöffnung.
// Jedes Blatt ist rundlich-herzförmig und läuft zur Mitte hin schmal zu – kein Pluszeichen.
const heartHole=new THREE.Path();
const cloverX=doorW*.52, cloverY=doorH*.79;
const petalOuter=.17, valley=.0625;
function rotateCloverPoint(x,y,a){
 return [cloverX+x*Math.cos(a)-y*Math.sin(a), cloverY+x*Math.sin(a)+y*Math.cos(a)];
}
function cloverMove(x,y,a){
 const p=rotateCloverPoint(x,y,a);heartHole.moveTo(p[0],p[1]);
}
function cloverCurve(c1x,c1y,c2x,c2y,x,y,a){
 const c1=rotateCloverPoint(c1x,c1y,a),c2=rotateCloverPoint(c2x,c2y,a),p=rotateCloverPoint(x,y,a);
 heartHole.bezierCurveTo(c1[0],c1[1],c2[0],c2[1],p[0],p[1]);
}
// Ein Blatt zeigt nach rechts; die beiden Rundungen ergeben eine sanfte Herzform.
for(let k=0;k<4;k++){
 const a=k*Math.PI/2;
 if(k===0) cloverMove(valley/Math.sqrt(2),-valley/Math.sqrt(2),a);
 cloverCurve(.10,-.065,.17,-.10,petalOuter,0,a);
 cloverCurve(.17,.10,.10,.065,valley/Math.sqrt(2),valley/Math.sqrt(2),a);
}
heartHole.closePath();doorShape.holes.push(heartHole);
const doorGeometry=new THREE.ExtrudeGeometry(doorShape,{depth:doorD,bevelEnabled:false,curveSegments:20});
const doorMesh=new THREE.Mesh(doorGeometry,white);doorMesh.position.z=-doorD/2;doorMesh.castShadow=false;doorMesh.receiveShadow=false;hinge.add(doorMesh);
// Schmale profilierte Leisten bleiben an den Rändern und in der Mitte; das Herzfeld bleibt frei.
const faceZ=doorD/2+.008,rail=.045;
for(const x of [rail/2,doorW-rail/2]) block(hinge,rail,doorH-.12,.025,whiteEdge,x,doorH/2,faceZ);
for(const y of [.10,doorH/2,doorH-.10]) block(hinge,doorW-.08,rail,.025,whiteEdge,doorW/2,y,faceZ);
const backZ=-doorD/2-.008;
for(const x of [rail/2,doorW-rail/2]) block(hinge,rail,doorH-.12,.025,whiteEdge,x,doorH/2,backZ);
for(const y of [.10,doorH/2,doorH-.10]) block(hinge,doorW-.08,rail,.025,whiteEdge,doorW/2,y,backZ);
// Drei kleine Scharniere an der linken Kante.
for(const y of [.28,H*.5,H-.28]){
 block(doorGroup,.045,.12,.21,metal,-W/2+frame,y,0);
}
// Griff auf beiden Seiten nahe der freien Kante.
const handleY=H*.51,handleX=doorW-.16;
for(const z of [doorD/2+.035,-doorD/2-.035]){
 const plate=block(hinge,.075,.13,.018,metal,handleX,handleY,z);
 const lever=block(hinge,.16,.025,.025,metal,handleX-.045,handleY-.025,z+(z>0?.025:-.025));lever.rotation.y=z>0?0:Math.PI;
}
let doorAngle=-Math.PI/10;hinge.rotation.y=doorAngle;
let down=false,lastX=0,lastY=0,auto=false,doorMode=false;let azimuth=.45,elevation=.12,distance=6.9;const target=new THREE.Vector3(0,H/2,0);
function updateCamera(){elevation=Math.max(-.15,Math.min(1.0,elevation));camera.position.set(target.x+distance*Math.sin(azimuth)*Math.cos(elevation),target.y+distance*Math.sin(elevation),target.z+distance*Math.cos(azimuth)*Math.cos(elevation));camera.lookAt(target)}updateCamera();
canvas.addEventListener('pointerdown',e=>{down=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;azimuth-=dx*.008;elevation+=dy*.006;updateCamera();lastX=e.clientX;lastY=e.clientY});
canvas.addEventListener('pointerup',()=>down=false);canvas.addEventListener('pointercancel',()=>down=false);
canvas.addEventListener('wheel',e=>{e.preventDefault();distance=Math.max(4.3,Math.min(13,distance+e.deltaY*.012));updateCamera()},{passive:false});
document.querySelector('#reset').onclick=()=>{azimuth=.45;elevation=.12;distance=6.9;doorAngle=-Math.PI/10;hinge.rotation.y=doorAngle;auto=false;document.querySelector('#spin').textContent='Automatisch drehen';updateCamera()};
document.querySelector('#doorMode').onclick=()=>{doorMode=!doorMode;doorAngle=doorMode?-Math.PI/2.5:-Math.PI/10;hinge.rotation.y=doorAngle;document.querySelector('#doorMode').textContent=doorMode?'Tür leicht öffnen':'Tür öffnen/schließen'};
document.querySelector('#spin').onclick=e=>{auto=!auto;e.target.textContent=auto?'Automatisch drehen: anhalten':'Automatisch drehen';};
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();updateCamera()}addEventListener('resize',resize);
function animate(){requestAnimationFrame(animate);if(auto&&!down)azimuth+=.004,updateCamera();renderer.render(scene,camera)}animate();
</script>
</body></html>
