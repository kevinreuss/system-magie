<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>System-Magie – Nebeltest V4</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#263345;color:#302b26}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 55%,#708196 0,#3d5068 58%,#202b3b 100%)}
/* Blickhöhe einer Figur: die Tischplatte läuft nach hinten zusammen. */
#table{position:absolute;left:50%;bottom:-11%;width:min(125vw,1100px);height:75%;transform:translateX(-50%);background:linear-gradient(135deg,#815638,#a87950 45%,#70472e);clip-path:polygon(13% 0,87% 0,100% 100%,0 100%);filter:drop-shadow(0 25px 24px #10172299)}
#board{position:absolute;left:50%;top:9%;width:84%;height:75%;transform:translateX(-50%);background:linear-gradient(135deg,#526a83,#617b96 52%,#455b73);clip-path:polygon(13% 0,87% 0,100% 100%,0 100%);border:0;box-shadow:inset 0 0 28px #172b4266}
#board:after{content:"";position:absolute;inset:0;clip-path:polygon(13% 0,87% 0,100% 100%,0 100%);border:3px solid #aab9c6;pointer-events:none}
#fog{position:absolute;left:50%;top:58%;width:190px;height:280px;transform:translate(-50%,-100%);transform-origin:50% 100%;touch-action:none;cursor:grab;filter:blur(1.2px);pointer-events:auto;z-index:2}
#fog:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 48% 12%,rgba(255,255,255,.62) 0 10%,transparent 28%),radial-gradient(ellipse at 25% 29%,rgba(245,250,255,.66) 0 14%,transparent 33%),radial-gradient(ellipse at 72% 34%,rgba(255,255,255,.6) 0 16%,transparent 35%),radial-gradient(ellipse at 43% 49%,rgba(245,250,255,.68) 0 20%,transparent 40%),radial-gradient(ellipse at 68% 62%,rgba(255,255,255,.56) 0 17%,transparent 36%),radial-gradient(ellipse at 35% 77%,rgba(239,247,255,.53) 0 13%,transparent 32%),radial-gradient(ellipse at 57% 88%,rgba(255,255,255,.46) 0 12%,transparent 30%);filter:blur(12px)}
#fog:after{content:"";position:absolute;inset:6% 12%;background:radial-gradient(ellipse at 50% 48%,rgba(235,244,255,.3),rgba(230,241,252,.13) 45%,transparent 74%);filter:blur(19px)}
#shadow{position:absolute;left:50%;top:58%;width:150px;height:22px;transform:translate(-50%,-50%);border-radius:50%;background:#17233388;filter:blur(12px);z-index:1}
.panel{position:fixed;left:12px;top:12px;z-index:3;padding:12px 14px;background:#fffdf2ee;border-radius:13px;box-shadow:0 4px 18px #10172266;max-width:min(350px,calc(100vw - 24px));font-size:13px}.title{font-weight:700;font-size:15px;margin-bottom:4px}.hint{line-height:1.4;margin-bottom:10px}.row{display:flex;align-items:center;gap:9px}label{white-space:nowrap}input{width:130px;accent-color:#806044}button{border:0;border-radius:8px;padding:7px 10px;background:#806044;color:white;font-size:12px}
@media(max-width:600px){#table{width:150vw;height:68%;bottom:-8%}#board{top:8%;height:75%;width:84%}#fog{width:150px;height:220px}.panel{max-width:calc(100vw - 24px)}}
</style></head><body><div id="stage"><div id="table"><div id="board"></div></div><div id="shadow"></div><div id="fog" aria-label="Nebel"></div></div><div class="panel"><div class="title">System-Magie · Nebeltest V4</div><div class="hint">Ansicht auf Augenhöhe einer Figur: Der Nebel steht sichtbar aufrecht über dem Brett. Mit Finger oder Maus verschieben; Größe über den Regler ändern.</div><div class="row"><label for="size">Größe</label><input id="size" type="range" min="35" max="100" value="65"><span id="value">65 %</span><button id="reset">Zurücksetzen</button></div></div>
<script>
const fog=document.getElementById('fog'),slider=document.getElementById('size'),value=document.getElementById('value'),shadow=document.getElementById('shadow');let drag=null,scale=1,x=.5,y=.58;
function place(){fog.style.left=(x*100)+'%';fog.style.top=(y*100)+'%';shadow.style.left=(x*100)+'%';shadow.style.top=(y*100)+'%'}
function setSize(){scale=Number(slider.value)/65;fog.style.width=(150*scale)+'px';fog.style.height=(220*scale)+'px';shadow.style.width=(110*scale)+'px';value.textContent=slider.value+' %'}
slider.addEventListener('input',setSize);fog.addEventListener('pointerdown',e=>{e.preventDefault();fog.setPointerCapture(e.pointerId);const r=fog.getBoundingClientRect();drag={dx:e.clientX-(r.left+r.width/2),dy:e.clientY-r.bottom}});fog.addEventListener('pointermove',e=>{if(!drag)return;const r=document.getElementById('stage').getBoundingClientRect();x=Math.max(.12,Math.min(.88,(e.clientX-drag.dx-r.left)/r.width));y=Math.max(.25,Math.min(.88,(e.clientY-drag.dy-r.top)/r.height));place()});function end(){drag=null}fog.addEventListener('pointerup',end);fog.addEventListener('pointercancel',end);document.getElementById('reset').onclick=()=>{slider.value=65;setSize();x=.5;y=.58;place()};setSize();place();
</script></body></html>
