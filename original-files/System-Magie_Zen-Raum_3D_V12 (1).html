let yaw=-40*Math.PI/180, pitch=13*Math.PI/180, verticalOffset=80, zoom=5.0, dragging=false,lx=0,ly=0;
function resize(){const d=Math.min(devicePixelRatio||1,2);c.width=Math.round(innerWidth*d);c.height=Math.round(innerHeight*d);ctx.setTransform(d,0,0,d,0,0);draw()}
function cameraPoint(p){
 // Tischpunkte werden in denselben Raum-Kameraraum wie die Hütte projiziert.
 const roomCam=window.__roomCamera||{yaw:0,pitch:0,H:5.5};
 // Tischansicht verwendet dasselbe Raumkamerasignal mit umgekehrtem Vorzeichen,
 // damit die sichtbare Tischdrehung der Raumdrehung entspricht.
 const cam={...roomCam,yaw:-roomCam.yaw};
 const x=p[0], y=p[1]-(cam.H-1.48), z=p[2]-1.6;
 const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw),cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);
 // entspricht der viewMatrix des Raums
 const vx=cy*x+sy*sp*y-sy*cp*z;
 const vy=cp*y+sp*z;
 const vz=sy*x-cy*sp*y+cy*cp*z;
 return [vx,vy,-vz];
}
function project(p){
 const q=cameraPoint(p),aspect=innerWidth/innerHeight;
 const fovy=aspect<1?72*Math.PI/180:68*Math.PI/180;
 const f=1/Math.tan(fovy/2),den=q[2];
 if(den<=0.05)return [NaN,NaN,den];
 return [(innerWidth/2)+(q[0]*f/aspect/den)*(innerWidth/2),(innerHeight/2)-(q[1]*f/den)*(innerHeight/2),den];
}
function addFace(points,color,stroke='#5d4129',lw=.8,texture=null){faces.push({points,color,stroke,lw,texture,depth:points.reduce((s,p)=>s+cameraPoint(p)[2],0)/points.length})}
function cuboid(x1,x2,y1,y2,z1,z2,colors){
 const [top,front,side,back,left,right]=colors;
 addFace([[x1,y2,z1],[x2,y2,z1],[x2,y2,z2],[x1,y2,z2]],top);
 addFace([[x1,y1,z1],[x2,y1,z1],[x2,y2,z1],[x1,y2,z1]],front);
 addFace([[x2,y1,z1],[x2,y1,z2],[x2,y2,z2],[x2,y2,z1]],side);
 addFace([[x1,y1,z2],[x2,y1,z2],[x2,y2,z2],[x1,y2,z2]],back||front);
 addFace([[x1,y1,z1],[x1,y1,z2],[x1,y2,z2],[x1,y2,z1]],left||side);
 addFace([[x1,y1,z1],[x2,y1,z1],[x2,y1,z2],[x1,y1,z2]],'#62452d');
}
function buildScene(){
 faces.length=0;
 const leg=.24, inset=1.68;
 // four sturdy square legs
 for(const x of [-inset,inset])for(const z of [-inset,inset]){
  const legStart=faces.length;
  cuboid(x-leg/2,x+leg/2,-1.48,.16,z-leg/2,z+leg/2,
  ['#91633d','#79502f','#68452c','#805532','#805532','#704a2d']);
  // Fotoholz auf die vier senkrechten Seitenflächen jedes Beins; die Oberseite bleibt schlicht.
  for(let k=1;k<=4;k++){faces[legStart+k].texture='leg';faces[legStart+k].stroke=null;}
 }
 // Die zusätzliche umlaufende Leiste unter der Tischplatte wurde entfernt.
 // One closed tabletop slab. Apply the photo texture directly to its real top face
 // instead of drawing a second, almost coplanar polygon above it (avoids overlap/z-fighting).
 const tabletopStart=faces.length;
 cuboid(-2,2,.19,.52,-2,2,['#a97749','#754b2c','#91613a','#805331','#865833','#805331']);
 faces[tabletopStart].texture='top';
 faces[tabletopStart].stroke=null;
 // Die vier Seitenwände der Tischplatte erhalten die längs verlaufende Fotoholz-Maserung.
 for(let k=1;k<=4;k++){faces[tabletopStart+k].texture='tableSide'; faces[tabletopStart+k].stroke=null;}
 // fixed 84% board, raised clearly above the tabletop with visible edge thickness
 const b=1.68, bottom=.535, top=.625;
 cuboid(-b,b,.52,bottom,-b,b,['#b49767','#9e7c51','#a98758','#9e7c51','#a98758','#9e7c51']);
 const edgeStart=faces.length;
 cuboid(-b,b,bottom,top,-b,b,['#d8bd8d','#b29568','#a88a5e','#b29568','#a88a5e','#a88a5e']);
 // Die vier senkrechten Brettseiten bekommen einen schmalen Streifen aus der Brett-Holzvorlage.
 for(let k=1;k<=4;k++){faces[edgeStart+k].texture='boardEdge'; faces[edgeStart+k].stroke=null;}
 addFace([[-b,top,-b],[b,top,-b],[b,top,b],[-b,top,b]],'#d8bd8d','#806747',1.1,'board');
}
function affinePatch(im,src,dst){
 const [a,b,c]=src;
 // Patch-Grenzen minimal überziehen, damit die Canvas-Antialias-Kanten keine feinen Linien bilden.
 const cx=(dst[0][0]+dst[1][0]+dst[2][0])/3, cy=(dst[0][1]+dst[1][1]+dst[2][1])/3;
 const dstExpanded=dst.map(([x,y])=>{const dx=x-cx,dy=y-cy,L=Math.hypot(dx,dy)||1;return [x+dx/L*1.5,y+dy/L*1.5]});
 const [p,q,r]=dstExpanded;
 const det=(b[0]-a[0])*(c[1]-a[1])-(c[0]-a[0])*(b[1]-a[1]);if(Math.abs(det)<1e-9)return;
 const A=((q[0]-p[0])*(c[1]-a[1])-(r[0]-p[0])*(b[1]-a[1]))/det;
 const C=((r[0]-p[0])*(b[0]-a[0])-(q[0]-p[0])*(c[0]-a[0]))/det;
 const B=((q[1]-p[1])*(c[1]-a[1])-(r[1]-p[1])*(b[1]-a[1]))/det;
 const D=((r[1]-p[1])*(b[0]-a[0])-(q[1]-p[1])*(c[0]-a[0]))/det;
 const E=p[0]-A*a[0]-C*a[1],F=p[1]-B*a[0]-D*a[1];
 ctx.save();ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.lineTo(r[0],r[1]);ctx.closePath();ctx.clip();ctx.transform(A,B,C,D,E,F);ctx.drawImage(im,0,0);ctx.restore();
}
function drawPhotoQuad(im,pts,crop=null){
 if(!im||!im.complete||!im.naturalWidth)return false;
 // Optional einen schmalen Ausschnitt der Vorlage verwenden, etwa für die Brettseiten.
 const cropX=crop?crop.x:0,cropY=crop?crop.y:0,w=crop?crop.w:im.naturalWidth,h=crop?crop.h:im.naturalHeight;
 // Eine durchgehende Textur wird als feines Raster auf das Viereck projiziert.
 // Kleine überlappende Patches verhindern eine sichtbare Diagonalnaht.
 const N=(im===photoTextures.edgeStrip?1:(im===photoTextures.tableSide?4:(im===photoTextures.top?6:(im===photoTextures.leg?4:8))));
 const bil=(u,v)=>{const x=(1-u)*(1-v)*pts[0][0]+u*(1-v)*pts[1][0]+u*v*pts[2][0]+(1-u)*v*pts[3][0];const y=(1-u)*(1-v)*pts[0][1]+u*(1-v)*pts[1][1]+u*v*pts[2][1]+(1-u)*v*pts[3][1];return [x,y]};
 ctx.save();ctx.beginPath();ctx.moveTo(...pts[0]);for(let i=1;i<pts.length;i++)ctx.lineTo(...pts[i]);ctx.closePath();ctx.clip();
 for(let j=0;j<N;j++)for(let i=0;i<N;i++){
  const u0=i/N,u1=(i+1)/N,v0=j/N,v1=(j+1)/N;
  const sx0=cropX+u0*w,sx1=cropX+u1*w,sy0=cropY+v0*h,sy1=cropY+v1*h;
  const p00=bil(u0,v0),p10=bil(u1,v0),p11=bil(u1,v1),p01=bil(u0,v1);
  affinePatch(im,[[sx0,sy0],[sx1,sy0],[sx1,sy1]],[p00,p10,p11]);
  affinePatch(im,[[sx0,sy0],[sx1,sy1],[sx0,sy1]],[p00,p11,p01]);
 }
 ctx.restore();return true;
}
function draw(){
 const w=c.clientWidth,h=c.clientHeight;if(!w||!h)return;ctx.clearRect(0,0,w,h);
 buildScene();
 // depth-sort all opaque polygons, so the near faces cover far faces correctly.
 faces.sort((a,b)=>b.depth-a.depth);
 // Erst die übrige Tischgeometrie, dann die geschlossene Tischoberseite als deckende Fläche,
 // danach Brettseiten und Brettoberseite. So kann unter der Tischplatte nichts durchscheinen.
 const orderedFaces=faces.filter(f=>f.texture!=='top' && f.texture!=='tableSide' && f.texture!=='board' && f.texture!=='boardEdge')
   // Die dekorativen Tischseiten liegen sichtbar vor den Beinen, damit diese den Rand nicht überdecken.
   .concat(faces.filter(f=>f.texture==='tableSide'))
   .concat(faces.filter(f=>f.texture==='top'))
   .concat(faces.filter(f=>f.texture==='boardEdge'))
   .concat(faces.filter(f=>f.texture==='board'));
 for(const f of orderedFaces){const cameraPts=f.points.map(cameraPoint);if(cameraPts.some(q=>q[2]<=0.5))continue;const pts=f.points.map(project);if(pts.length<3)continue;ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();
 let didTexture=false;
 // Brettoberseite zuerst deckend füllen und danach die Holztextur auftragen.
 if(f.texture==='board'){ctx.fillStyle=f.color;ctx.fill();didTexture=drawPhotoQuad(photoTextures.board,pts);}
 else if(f.texture==='boardEdge'){ctx.fillStyle=f.color;ctx.fill();didTexture=drawPhotoQuad(photoTextures.edgeStrip,pts);}
 else if(f.texture==='tableSide'){ctx.fillStyle=f.color;ctx.fill();didTexture=drawPhotoQuad(photoTextures.tableSide,pts);}
 else if(f.texture==='leg'){ctx.fillStyle=f.color;ctx.fill();didTexture=drawPhotoQuad(photoTextures.leg,pts);}
 else if(f.texture==='top'){ctx.fillStyle=f.color;ctx.fill();didTexture=drawPhotoQuad(photoTextures.top,pts);}
 if(!didTexture && f.texture!=='board'){ctx.fillStyle=f.color;ctx.fill();}
 // Die Kontur der Brettoberseite wird weggelassen, damit kein dunkler Eckhaken entsteht.
 if(f.stroke && f.texture!=='board'){ctx.strokeStyle=f.stroke;ctx.lineWidth=f.lw;ctx.stroke()}}
}
function labels(){
 $('yawv').textContent=Math.round(yaw*180/Math.PI)+'°';
 $('pitchv').textContent=Math.round(pitch*180/Math.PI)+'°';
 $('verticalv').textContent=Math.round(verticalOffset)+' px';
 $('zoomv').textContent=zoom.toFixed(1);
}
$('yaw').oninput=e=>{yaw=+e.target.value*Math.PI/180;labels();draw()};
$('pitch').oninput=e=>{pitch=+e.target.value*Math.PI/180;labels();draw()};
$('vertical').oninput=e=>{verticalOffset=+e.target.value;labels();draw()};
$('zoom').oninput=e=>{zoom=+e.target.value;labels();draw()};
window.__tableDraw=draw;window.__tableMoveBy=function(dx,dy){if(window.__roomMoveBy)window.__roomMoveBy(dx,dy)};window.__tableYawBy=function(dx){yaw+=dx*.008;labels();draw()};window.__tableReset=function(){yaw=-40*Math.PI/180;pitch=13*Math.PI/180;verticalOffset=80;zoom=5.0;$('yaw').value=-40;$('pitch').value=13;$('vertical').value=80;$('zoom').value=5.0;labels();draw()};Object.values(photoTextures).forEach(im=>im.onload=draw);window.addEventListener('resize',resize);labels();resize();
})();


(()=>{let mode='table',dragging=false,lastX=0,lastY=0;const layer=document.getElementById('tableLayer'),modeBtn=document.getElementById('modeBtn'),modeLabel=document.getElementById('modeLabel'),hint=document.getElementById('hint'),resetBtn=document.getElementById('resetBtn');function setMode(next){mode=next;modeLabel.textContent='Aktiver Modus: '+(mode==='table'?'Tisch':'Raum');modeBtn.textContent=mode==='table'?'Zu Raum wechseln':'Zu Tisch wechseln';hint.textContent=mode==='table'?'Tischansicht testen · Größe beibehalten':'Raum drehen · Tisch folgt derselben Kameradrehung';}modeBtn.addEventListener('click',()=>setMode(mode==='table'?'room':'table'));resetBtn.addEventListener('click',()=>{if(window.__roomReset)window.__roomReset();setMode('room');});layer.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;layer.setPointerCapture(e.pointerId)});layer.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;if(mode==='table'){if(window.__tableMoveBy)window.__tableMoveBy(dx,dy)}else if(window.__roomMoveBy){window.__roomMoveBy(dx,dy);if(window.__tableDraw)window.__tableDraw()}});layer.addEventListener('pointerup',()=>dragging=false);layer.addEventListener('pointercancel',()=>dragging=false);setMode('room');})();
